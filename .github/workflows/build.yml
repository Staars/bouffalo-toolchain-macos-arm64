name: Build macOS ARM64 Xuantie Toolchain

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Latest stable upstream at time of scaffolding (2026-09-13).
# V3.0.1 is the newest non-nightly release on XUANTIE-RV/xuantie-gnu-toolchain.
# T-head-Semi/xuantie-gnu-toolchain redirects to XUANTIE-RV; use canonical URL.
env:
  XUANTIE_REPO: https://github.com/XUANTIE-RV/xuantie-gnu-toolchain.git
  XUANTIE_REF: V3.0.1 # tag; full commit is c66309b74edd581125a8165f07296c85d3fa71c9
  XUANTIE_BRANCH: xuantie-gnu-toolchain
  INSTALL_DIR: xuantie-gnu-toolchain/install
  # Set to 'true' to add --enable-gdb (longer build). Default 'false' for faster Bouffalo SDK builds.
  ENABLE_GDB: 'false'

jobs:
  build:
    # macos-14 is deprecated (fully unsupported after 2026-11-02), so build on
    # the supported arm64 images instead. Both jobs produce native arm64 binaries.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    env:
      TARBALL: xuantie-gnu-toolchain-${{ matrix.os }}-arm64.tar.gz

    steps:
      - uses: actions/checkout@v5 # node24 runtime (v4 is node20, deprecated)

      - name: Show runner arch
        run: |
          uname -a
          arch
          sw_vers
          sysctl -n hw.ncpu || true

      - name: Install Homebrew dependencies
        run: |
          brew update
          brew install python3 gawk gnu-sed gmp mpfr libmpc isl zlib expat coreutils texinfo wget autoconf automake libtool pkg-config

      - name: Add GNU tools to PATH
        run: |
          echo "$(brew --prefix)/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/opt/gnu-sed/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Clone Xuantie GNU Toolchain (pinned)
        run: |
          git clone --branch "$XUANTIE_BRANCH" "$XUANTIE_REPO" xuantie-gnu-toolchain
          cd xuantie-gnu-toolchain
          git fetch --tags origin
          git checkout "$XUANTIE_REF"
          # NOTE: do NOT use `git submodule update --init --recursive` here.
          # At V3.0.1 the pinned dejagnu commit is no longer fetchable from
          # riscv-collab/riscv-dejagnu ("not our ref"), and qemu/llvm/spike/pk/
          # musl/glibc/dejagnu are not needed for a bare-metal (newlib) build
          # anyway (upstream configure fetches required modules on demand).
          git submodule update --init binutils gcc newlib
          if [ "$ENABLE_GDB" = "true" ]; then
            git submodule update --init gdb
          fi
          git rev-parse HEAD
          git submodule status || true
          git status --short --branch || true
          # NOTE: `M linux-headers/...netfilter/...` case-collision warnings on
          # macOS are harmless for newlib builds. The default APFS volume is
          # case-insensitive and those headers (only used for linux/glibc
          # builds) collide by case. Ignore them.

      - name: Patch for macOS ARM64
        working-directory: xuantie-gnu-toolchain
        run: |
          # Remove Darwin-specific object files that break on arm64.
          # Upstream config.host assumes old x86_64-darwin host fragments.
          # NOTE: since V3.0.1 the gcc submodule lives at `gcc/`, not `riscv-gcc/`
          # (confirmed by submodule map: `Submodule 'gcc' ... path 'gcc'`).
          if [ -f gcc/gcc/config.host ]; then
            perl -pi -e 's/.*=host-darwin\.o$//' gcc/gcc/config.host || true
            perl -pi -e 's/.* x-darwin\.$//' gcc/gcc/config.host || true
            git diff -- gcc/gcc/config.host || true
          else
            echo "gcc/gcc/config.host not found, skipping darwin patch"
          fi

          # If newlib fails, uncomment and apply the community patch:
          # curl -L https://raw.githubusercontent.com/pine64-org/pine_ox64/master/patches/riscv-newlib.patch | patch -p1

      - name: Configure
        working-directory: xuantie-gnu-toolchain
        run: |
          GDB_FLAG=""
          if [ "$ENABLE_GDB" = "true" ]; then
            GDB_FLAG="--enable-gdb"
          fi
          ./configure --prefix="$GITHUB_WORKSPACE/$INSTALL_DIR" --with-cmodel=medany --enable-multilib $GDB_FLAG

      - name: Build
        working-directory: xuantie-gnu-toolchain
        run: |
          make -j"$(sysctl -n hw.ncpu)"

      - name: Verify native arm64 binaries
        run: |
          "$GITHUB_WORKSPACE/$INSTALL_DIR/bin/riscv64-unknown-elf-gcc" --version
          file "$GITHUB_WORKSPACE/$INSTALL_DIR/bin/riscv64-unknown-elf-gcc"
          # Must print "arm64", not "x86_64"
          file "$GITHUB_WORKSPACE/$INSTALL_DIR/bin/riscv64-unknown-elf-gcc" | grep -q "arm64"
          otool -L "$GITHUB_WORKSPACE/$INSTALL_DIR/bin/riscv64-unknown-elf-gcc" || true

      - name: Package
        run: |
          tar -czf "$GITHUB_WORKSPACE/$TARBALL" -C "$GITHUB_WORKSPACE/$INSTALL_DIR" .
          shasum -a 256 "$GITHUB_WORKSPACE/$TARBALL" | tee "$GITHUB_WORKSPACE/$TARBALL.sha256"
          ls -lh "$GITHUB_WORKSPACE/$TARBALL" "$GITHUB_WORKSPACE/$TARBALL.sha256"

      - name: Upload artifact
        # Pinned main @ 043fb46 (2026-04-10, node24). No v6 release yet (v5 is still
        # node20, deprecated) — switch back to a version tag once v6 exists.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xuantie-gnu-toolchain-${{ matrix.os }}-arm64
          path: |
            ${{ env.TARBALL }}
            ${{ env.TARBALL }}.sha256

      - name: Create Release
        # NOTE: softprops/action-gh-release@v2 is still node20 (deprecated), so the
        # release is published with the preinstalled `gh` CLI instead (no node at all).
        # Matrix race-safe: exactly one job creates the release, both attach assets.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes 2>/dev/null || true
          fi
          gh release upload "$TAG" "$TARBALL" "$TARBALL.sha256" --clobber

name: Build Xuantie Toolchain (GCC 14)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  XUANTIE_REPO: https://github.com/XUANTIE-RV/xuantie-gnu-toolchain.git
  XUANTIE_REF: V3.0.1
  XUANTIE_BRANCH: xuantie-gnu-toolchain
  INSTALL_DIR: xuantie-gnu-toolchain/install
  ENABLE_GDB: 'true'

jobs:
  build-unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            name: macos-26-arm64
          - os: macos-15-intel
            name: macos-intel
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: ubuntu-24.04-arm
            name: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    env:
      TARBALL: xuantie-gnu-toolchain-${{ matrix.name }}.tar.gz

    steps:
      - uses: actions/checkout@v5

      - name: Show runner arch
        run: |
          uname -a
          arch
          (sw_vers || true)
          sysctl -n hw.ncpu 2>/dev/null || nproc

      - name: Install Homebrew dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install python3 gawk gnu-sed zlib expat coreutils texinfo wget \
                       autoconf automake libtool pkg-config flock m4

      - name: Add GNU tools to PATH
        if: runner.os == 'macOS'
        run: |
          echo "$(brew --prefix)/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/opt/gnu-sed/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bison flex gawk texinfo autoconf automake \
            libtool libtool-bin pkg-config wget curl python3 git \
            m4 zlib1g-dev libexpat1-dev patchutils bc

      - name: Build static host dependencies (GMP, MPFR, MPC, ISL)
        run: |
          set -euo pipefail
          DEPS="$RUNNER_TEMP/host-deps"
          mkdir -p "$DEPS"
          JOBS="$( (sysctl -n hw.ncpu 2>/dev/null) || nproc )"
          cd "$RUNNER_TEMP"

          GMP_EXTRA=""
          if [ "${{ runner.os }}" = "macOS" ] && [ "$(uname -m)" = "x86_64" ]; then
            GMP_EXTRA="--disable-assembly"
          fi

          curl -fsSLO https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz
          tar xf gmp-6.3.0.tar.xz
          ( cd gmp-6.3.0
            ./configure --prefix="$DEPS" --disable-shared --enable-static $GMP_EXTRA
            make -j"$JOBS" && make install )

          curl -fsSLO https://ftp.gnu.org/gnu/mpfr/mpfr-4.2.1.tar.xz
          tar xf mpfr-4.2.1.tar.xz
          ( cd mpfr-4.2.1
            ./configure --prefix="$DEPS" --disable-shared --enable-static --with-gmp="$DEPS"
            make -j"$JOBS" && make install )

          curl -fsSLO https://ftp.gnu.org/gnu/mpc/mpc-1.3.1.tar.gz
          tar xf mpc-1.3.1.tar.gz
          ( cd mpc-1.3.1
            ./configure --prefix="$DEPS" --disable-shared --enable-static \
              --with-gmp="$DEPS" --with-mpfr="$DEPS"
            make -j"$JOBS" && make install )

          curl -fsSLO https://libisl.sourceforge.io/isl-0.26.tar.xz
          tar xf isl-0.26.tar.xz
          ( cd isl-0.26
            ./configure --prefix="$DEPS" --disable-shared --enable-static \
              --with-gmp-prefix="$DEPS"
            make -j"$JOBS" && make install )

          if find "$DEPS" -name '*.dylib' -o -name '*.so' -print -quit | grep -q .; then
            echo "ERROR: shared libraries were built into $DEPS"
            find "$DEPS" \( -name '*.dylib' -o -name '*.so' \)
            exit 1
          fi
          ls -l "$DEPS/lib"
          echo "HOST_DEPS=$DEPS" >> "$GITHUB_ENV"

      - name: Clone Xuantie GNU Toolchain (pinned)
        run: |
          git clone --branch "$XUANTIE_BRANCH" "$XUANTIE_REPO" xuantie-gnu-toolchain
          cd xuantie-gnu-toolchain
          git fetch --tags origin
          git checkout "$XUANTIE_REF"
          git submodule update --init binutils gcc newlib
          if [ "$ENABLE_GDB" = "true" ]; then
            git submodule update --init gdb
          fi
          git rev-parse HEAD
          git submodule status || true

      - name: Patch (macOS-specific)
        if: runner.os == 'macOS'
        working-directory: xuantie-gnu-toolchain
        run: |
          if [ -f gcc/gcc/config.host ]; then
            perl -pi -e 's/.*=host-darwin\.o$//' gcc/gcc/config.host || true
            perl -pi -e 's/.* x-darwin\.$//'      gcc/gcc/config.host || true
            git diff -- gcc/gcc/config.host || true
          fi

          for ZUTIL in binutils/zlib/zutil.h gdb/zlib/zutil.h; do
            if [ ! -f "$ZUTIL" ]; then echo "$ZUTIL not present, skipping"; continue; fi
            python3 - "$ZUTIL" <<'PYEOF'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          lines = p.read_text().splitlines(keepends=True)
          if any("elif !defined(__APPLE__)" in l for l in lines):
              print(f"{p} already patched"); sys.exit(0)
          patched = 0
          for i, l in enumerate(lines):
              if "define fdopen(fd,mode) NULL" not in l:
                  continue
              for j in range(i - 1, max(i - 8, 0), -1):
                  if re.match(r"\s*#\s*else\s*$", lines[j]):
                      if "unix.h" in lines[j - 1]:
                          indent = lines[j].split("else")[0]
                          lines[j] = f"{indent}elif !defined(__APPLE__)\n"
                          patched += 1
                      break
          if patched != 1:
              sys.exit(f"FATAL: expected 1 fdopen site in {p}, patched {patched}")
          p.write_text("".join(lines))
          print(f"patched {p} for Apple fdopen")
          PYEOF
            git -C "${ZUTIL%%/*}" diff -- "${ZUTIL#*/}" || true
          done

          if [ -f gdb/gdbsupport/enum-flags.h ]; then
            python3 - gdb/gdbsupport/enum-flags.h <<'PYEOF'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          src = p.read_text()
          if "std::is_signed<typename std::underlying_type<T>::type>::value" in src:
              print(f"{p} already patched"); sys.exit(0)
          lines = src.splitlines(keepends=True)
          s = next((i for i, l in enumerate(lines) if "struct enum_underlying_type" in l), None)
          if s is None or s == 0 or "template<typename T>" not in lines[s - 1]:
              sys.exit(f"FATAL: enum_underlying_type head not found in {p}")
          start = s - 1
          end = next((i for i in range(s, len(lines)) if lines[i].rstrip() == "};"), None)
          if end is None:
              sys.exit(f"FATAL: end not found in {p}")
          if "T (-1)" not in "".join(lines[start:end]):
              sys.exit(f"FATAL: enum_underlying_type body changed upstream in {p}")
          new_block = """template<typename T>
          struct enum_underlying_type
          {
            typedef typename
              integer_for_size<sizeof (T),
                               std::is_signed<typename std::underlying_type<T>::type>::value>::type
              type;
          };
          """
          lines[start:end + 1] = [new_block]
          p.write_text("".join(lines))
          print(f"patched {p} for enum signedness")
          PYEOF
            git -C gdb diff -- gdbsupport/enum-flags.h || true
          fi

          if [ -f gdb/gdb/unittests/enum-flags-selftests.c ]; then
            python3 - gdb/gdb/unittests/enum-flags-selftests.c <<'PYEOF'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          src = p.read_text()
          reps = [
            ("CHECK_VALID (true,  int,  true ? EF () : EF2 ())",
             "CHECK_VALID (true,  int,  (int)(true ? EF () : EF2 ()))"),
            ("CHECK_VALID (true,  int,  true ? EF2 () : EF ())",
             "CHECK_VALID (true,  int,  (int)(true ? EF2 () : EF ()))"),
            ("CHECK_VALID (true,  int,  true ? EF () : RE2 ())",
             "CHECK_VALID (true,  int,  (int)(true ? EF () : RE2 ()))"),
            ("CHECK_VALID (true,  int,  true ? RE2 () : EF ())",
             "CHECK_VALID (true,  int,  (int)(true ? RE2 () : EF ()))"),
          ]
          n = 0
          for old, new in reps:
              if new in src: continue
              if old in src: src = src.replace(old, new, 1); n += 1
          if n: p.write_text(src); print(f"patched {n} selftest lines")
          PYEOF
            git -C gdb diff -- gdb/unittests/enum-flags-selftests.c || true
          fi

      - name: Patch (all Unix hosts)
        working-directory: xuantie-gnu-toolchain
        run: |
          if [ -f newlib/libc/machine/riscv/pthread.c ]; then
            python3 - newlib/libc/machine/riscv/pthread.c <<'PYEOF'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          src = p.read_text()
          old = '#include "../../libgloss/libnosys/config.h"'
          if old not in src:
              print(f"{p}: nothing to patch"); sys.exit(0)
          p.write_text(src.replace(old, '#include "config.h"', 1))
          print(f"patched {p}")
          PYEOF
            git -C newlib diff -- libc/machine/riscv/pthread.c || true
          fi

      - name: Configure
        working-directory: xuantie-gnu-toolchain
        run: |
          GDB_FLAG="--enable-gdb"
          if [ "$ENABLE_GDB" != "true" ]; then GDB_FLAG="--disable-gdb"; fi

          export PKG_CONFIG_PATH=""
          export PKG_CONFIG_LIBDIR="$HOST_DEPS/lib/pkgconfig"

          ./configure \
            --prefix="$GITHUB_WORKSPACE/$INSTALL_DIR" \
            --with-cmodel=medany \
            --enable-multilib \
            $GDB_FLAG \
            --with-gcc-dep-libs="$HOST_DEPS" \
            --with-stage1-ldflags="-static-libgcc" \
            --with-boot-ldflags="-static-libgcc -static-libstdc++" \
            LDFLAGS="-L$HOST_DEPS/lib" \
            CPPFLAGS="-I$HOST_DEPS/include"

          [ -f Makefile ] || { echo "ERROR: no Makefile after configure" >&2; exit 1; }
          cp Makefile Makefile.bak

          # NOTE: this perl line is intentionally the version from the working
          # YAML (single space, matches nothing, i.e. a no-op).  Used here as a
          # bisection test to see whether the "\s* + ldflags" variant from the
          # previous attempt is what broke the build.
          perl -pi -e 's|^CONFIGURE_GCC_DEP_LIBS = |CONFIGURE_GCC_DEP_LIBS = --without-zstd |' Makefile
          echo "--- CONFIGURE_GCC_DEP_LIBS after perl ---"
          grep -n '^CONFIGURE_GCC_DEP_LIBS' Makefile || true

      - name: Build
        working-directory: xuantie-gnu-toolchain
        run: |
          JOBS="$( (sysctl -n hw.ncpu 2>/dev/null) || nproc )"
          make \
            BINUTILS_TARGET_FLAGS_EXTRA="--without-zstd" \
            BINUTILS_NATIVE_FLAGS_EXTRA="--without-zstd" \
            GDB_TARGET_FLAGS_EXTRA="--without-zstd" \
            GDB_NATIVE_FLAGS_EXTRA="--without-zstd" \
            -j"$JOBS"

      - name: Verify
        run: |
          GCC_BIN="$GITHUB_WORKSPACE/$INSTALL_DIR/bin/riscv64-unknown-elf-gcc"
          "$GCC_BIN" --version
          file "$GCC_BIN"

          if [ "${{ runner.os }}" = "macOS" ]; then
            if find "$GITHUB_WORKSPACE/$INSTALL_DIR" -type f -print0 \
                 | xargs -0 -n1 -P4 sh -c '
                     file -b "$0" | grep -q "Mach-O" || exit 0
                     otool -L "$0" 2>/dev/null
                   ' \
                 | grep -E "^\s+/opt/homebrew|^\s+/usr/local"; then
              echo "ERROR: Homebrew paths still present"; exit 1
            fi
          else
            if find "$GITHUB_WORKSPACE/$INSTALL_DIR" -type f -perm -u+x -print0 \
                 | xargs -0 -n1 -P4 sh -c '
                     file -b "$0" | grep -q "ELF" || exit 0
                     ldd "$0" 2>/dev/null
                   ' \
                 | grep -E "^\s+/tmp/|/home/runner/"; then
              echo "ERROR: runner-local paths in toolchain"; exit 1
            fi
          fi
          echo "OK: verify step complete."

      - name: Package
        run: |
          tar -czf "$GITHUB_WORKSPACE/$TARBALL" -C "$GITHUB_WORKSPACE/$INSTALL_DIR" .
          if command -v shasum >/dev/null; then
            shasum -a 256 "$GITHUB_WORKSPACE/$TARBALL" | tee "$GITHUB_WORKSPACE/$TARBALL.sha256"
          else
            sha256sum "$GITHUB_WORKSPACE/$TARBALL" | tee "$GITHUB_WORKSPACE/$TARBALL.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xuantie-gnu-toolchain-${{ matrix.name }}
          path: |
            ${{ env.TARBALL }}
            ${{ env.TARBALL }}.sha256

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" "$TARBALL" "$TARBALL.sha256" --clobber

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      TARBALL: xuantie-gnu-toolchain-windows-x86_64.tar.gz

    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make tar wget curl python autoconf automake libtool pkgconf
            texinfo gawk bison flex m4 patch diffutils
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-gmp mingw-w64-x86_64-mpfr mingw-w64-x86_64-mpc
            mingw-w64-x86_64-isl mingw-w64-x86_64-zlib mingw-w64-x86_64-expat

      - name: Clone (MSYS2)
        shell: msys2 {0}
        run: |
          git clone --branch "$XUANTIE_BRANCH" "$XUANTIE_REPO" xuantie-gnu-toolchain
          cd xuantie-gnu-toolchain
          git fetch --tags origin
          git checkout "$XUANTIE_REF"
          git submodule update --init binutils gcc newlib
          [ "$ENABLE_GDB" = "true" ] && git submodule update --init gdb || true

      - name: Patch newlib pthread (MSYS2)
        shell: msys2 {0}
        working-directory: xuantie-gnu-toolchain
        run: |
          if [ -f newlib/libc/machine/riscv/pthread.c ]; then
            sed -i 's|#include "../../libgloss/libnosys/config.h"|#include "config.h"|' \
              newlib/libc/machine/riscv/pthread.c
          fi

      - name: Configure (MSYS2)
        shell: msys2 {0}
        working-directory: xuantie-gnu-toolchain
        env:
          MSYSTEM: MINGW64
        run: |
          GDB_FLAG="--enable-gdb"; [ "$ENABLE_GDB" = "true" ] || GDB_FLAG="--disable-gdb"

          ./configure \
            --host=x86_64-w64-mingw32 \
            --prefix="$(cygpath -u "$GITHUB_WORKSPACE")/$INSTALL_DIR" \
            --with-cmodel=medany \
            --enable-multilib \
            $GDB_FLAG \
            --with-stage1-ldflags="-static-libgcc" \
            --with-boot-ldflags="-static-libgcc -static-libstdc++"

          [ -f Makefile ] || { echo "ERROR: no Makefile"; exit 1; }
          cp Makefile Makefile.bak
          perl -pi -e 's|^CONFIGURE_GCC_DEP_LIBS = |CONFIGURE_GCC_DEP_LIBS = --without-zstd |' Makefile
          grep -n '^CONFIGURE_GCC_DEP_LIBS' Makefile || true

      - name: Build (MSYS2)
        shell: msys2 {0}
        working-directory: xuantie-gnu-toolchain
        env:
          MSYSTEM: MINGW64
        run: |
          make \
            BINUTILS_TARGET_FLAGS_EXTRA="--without-zstd" \
            BINUTILS_NATIVE_FLAGS_EXTRA="--without-zstd" \
            GDB_TARGET_FLAGS_EXTRA="--without-zstd" \
            GDB_NATIVE_FLAGS_EXTRA="--without-zstd" \
            -j"$(nproc)"

      - name: Package (MSYS2)
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE/$INSTALL_DIR"
          tar -czf "$GITHUB_WORKSPACE/$TARBALL" .
          sha256sum "$GITHUB_WORKSPACE/$TARBALL" | tee "$GITHUB_WORKSPACE/$TARBALL.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xuantie-gnu-toolchain-windows-x86_64
          path: |
            ${{ env.TARBALL }}
            ${{ env.TARBALL }}.sha256

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" "$TARBALL" "$TARBALL.sha256" --clobber

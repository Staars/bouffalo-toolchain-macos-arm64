name: Build Xuantie Toolchain (GCC 14)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  XUANTIE_REPO: https://github.com/XUANTIE-RV/xuantie-gnu-toolchain.git
  XUANTIE_REF: V3.0.1
  XUANTIE_BRANCH: xuantie-gnu-toolchain
  INSTALL_DIR: xuantie-gnu-toolchain/install
  ENABLE_GDB: 'true'

jobs:
  build-unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            name: macos-26-arm64
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: ubuntu-24.04-arm
            name: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    env:
      TARBALL: xuantie-gnu-toolchain-${{ matrix.name }}.tar.gz

    steps:
      - uses: actions/checkout@v5

      - name: Show runner arch
        run: |
          uname -a
          arch
          (sw_vers || true)
          sysctl -n hw.ncpu 2>/dev/null || nproc

      - name: Install Homebrew dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install python3 gawk gnu-sed zlib expat coreutils texinfo wget \
                       autoconf automake libtool pkg-config flock m4

      - name: Add GNU tools to PATH
        if: runner.os == 'macOS'
        run: |
          echo "$(brew --prefix)/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/opt/gnu-sed/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bison flex gawk texinfo autoconf automake \
            libtool libtool-bin pkg-config wget curl python3 git \
            m4 zlib1g-dev libexpat1-dev patchutils bc

      - name: Build static host dependencies (GMP, MPFR, MPC, ISL)
        run: |
          set -euo pipefail
          DEPS="$RUNNER_TEMP/host-deps"
          mkdir -p "$DEPS"
          JOBS="$( (sysctl -n hw.ncpu 2>/dev/null) || nproc )"
          cd "$RUNNER_TEMP"

          fetch_tarball() {
            local out="$1"; shift
            for url in "$@"; do
              echo "Fetching $out from $url"
              if curl -fsSL --retry 5 --retry-delay 5 --retry-connrefused \
                      --connect-timeout 30 -o "$out" "$url"; then
                echo "  ok"
                return 0
              fi
              echo "  failed, trying next mirror"
              rm -f "$out"
            done
            echo "ERROR: could not fetch $out from any mirror"
            return 1
          }

          fetch_tarball gmp-6.3.0.tar.xz \
            https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz \
            https://gmplib.org/download/gmp/gmp-6.3.0.tar.xz

          fetch_tarball mpfr-4.2.1.tar.xz \
            https://ftp.gnu.org/gnu/mpfr/mpfr-4.2.1.tar.xz

          fetch_tarball mpc-1.3.1.tar.gz \
            https://ftp.gnu.org/gnu/mpc/mpc-1.3.1.tar.gz

          fetch_tarball isl-0.26.tar.xz \
            https://libisl.sourceforge.io/isl-0.26.tar.xz \
            https://downloads.sourceforge.net/project/libisl/isl-0.26.tar.xz \
            https://master.dl.sourceforge.net/project/libisl/isl-0.26.tar.xz

          tar xf gmp-6.3.0.tar.xz
          ( cd gmp-6.3.0
            ./configure --prefix="$DEPS" --disable-shared --enable-static
            make -j"$JOBS" && make install )

          tar xf mpfr-4.2.1.tar.xz
          ( cd mpfr-4.2.1
            ./configure --prefix="$DEPS" --disable-shared --enable-static --with-gmp="$DEPS"
            make -j"$JOBS" && make install )

          tar xf mpc-1.3.1.tar.gz
          ( cd mpc-1.3.1
            ./configure --prefix="$DEPS" --disable-shared --enable-static \
              --with-gmp="$DEPS" --with-mpfr="$DEPS"
            make -j"$JOBS" && make install )

          tar xf isl-0.26.tar.xz
          ( cd isl-0.26
            ./configure --prefix="$DEPS" --disable-shared --enable-static \
              --with-gmp-prefix="$DEPS"
            make -j"$JOBS" && make install )

          if find "$DEPS" -name '*.dylib' -o -name '*.so' -print -quit | grep -q .; then
            echo "ERROR: shared libraries were built into $DEPS"
            find "$DEPS" \( -name '*.dylib' -o -name '*.so' \)
            exit 1
          fi
          ls -l "$DEPS/lib"

          {
            echo "HOST_DEPS=$DEPS"
            echo "PKG_CONFIG_PATH="
            echo "PKG_CONFIG_LIBDIR=$DEPS/lib/pkgconfig"
            echo "PKG_CONFIG_SYSROOT_DIR="
          } >> "$GITHUB_ENV"

      - name: Clone Xuantie GNU Toolchain (pinned)
        run: |
          git clone --branch "$XUANTIE_BRANCH" "$XUANTIE_REPO" xuantie-gnu-toolchain
          cd xuantie-gnu-toolchain
          git fetch --tags origin
          git checkout "$XUANTIE_REF"
          git submodule update --init binutils gcc newlib
          if [ "$ENABLE_GDB" = "true" ]; then
            git submodule update --init gdb
          fi
          git rev-parse HEAD
          git submodule status || true

      - name: Patch readline for C23 (all hosts)
        working-directory: xuantie-gnu-toolchain
        run: |
          SIGNALS=""
          for CAND in gdb/readline/readline/signals.c \
                      readline/readline/signals.c ; do
            [ -f "$CAND" ] && SIGNALS="$CAND" && break
          done
          if [ -z "$SIGNALS" ]; then
            echo "readline signals.c not found, skipping C23 patch"
            exit 0
          fi
          echo "Patching $SIGNALS"
          python3 - "$SIGNALS" <<'PYEOF'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          src = p.read_text()
          changed = False
          new_typedef = "typedef RETSIGTYPE SigHandler (int);"
          if new_typedef in src:
              print("SigHandler typedef already patched")
          else:
              pat = re.compile(r'typedef\s+RETSIGTYPE\s+SigHandler\s*\(\s*\)\s*;')
              src, n = pat.subn(new_typedef, src, count=1)
              if n != 1:
                  sys.exit("FATAL: SigHandler typedef not found")
              changed = True
              print("Patched SigHandler typedef for C23")
          pat = re.compile(r'(#\s*define\s+SIGHANDLER_RETURN\s+)return\s*\(0\)')
          src, n = pat.subn(r'\1return', src, count=1)
          if n:
              changed = True
              print("Patched SIGHANDLER_RETURN for C23")
          else:
              print("SIGHANDLER_RETURN already correct")
          if changed:
              p.write_text(src)
          PYEOF
          git diff -- "$SIGNALS" || true

      - name: Patch (macOS-specific)
        if: runner.os == 'macOS'
        working-directory: xuantie-gnu-toolchain
        run: |
          if [ -f gcc/gcc/config.host ]; then
            perl -pi -e 's/.*=host-darwin\.o$//' gcc/gcc/config.host || true
            perl -pi -e 's/.* x-darwin\.$//'      gcc/gcc/config.host || true
            git diff -- gcc/gcc/config.host || true
          fi

          for ZUTIL in binutils/zlib/zutil.h gdb/zlib/zutil.h; do
            if [ ! -f "$ZUTIL" ]; then echo "$ZUTIL not present, skipping"; continue; fi
            python3 - "$ZUTIL" <<'PYEOF'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          lines = p.read_text().splitlines(keepends=True)
          if any("elif !defined(__APPLE__)" in l for l in lines):
              print(f"{p} already patched"); sys.exit(0)
          patched = 0
          for i, l in enumerate(lines):
              if "define fdopen(fd,mode) NULL" not in l:
                  continue
              for j in range(i - 1, max(i - 8, 0), -1):
                  if re.match(r"\s*#\s*else\s*$", lines[j]):
                      if "unix.h" in lines[j - 1]:
                          indent = lines[j].split("else")[0]
                          lines[j] = f"{indent}elif !defined(__APPLE__)\n"
                          patched += 1
                      break
          if patched != 1:
              sys.exit(f"FATAL: expected 1 fdopen site in {p}, patched {patched}")
          p.write_text("".join(lines))
          print(f"patched {p} for Apple fdopen")
          PYEOF
            git -C "${ZUTIL%%/*}" diff -- "${ZUTIL#*/}" || true
          done

          if [ -f gdb/gdbsupport/enum-flags.h ]; then
            python3 - gdb/gdbsupport/enum-flags.h <<'PYEOF'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          src = p.read_text()
          if "std::is_signed<typename std::underlying_type<T>::type>::value" in src:
              print(f"{p} already patched"); sys.exit(0)
          lines = src.splitlines(keepends=True)
          s = next((i for i, l in enumerate(lines) if "struct enum_underlying_type" in l), None)
          if s is None or s == 0 or "template<typename T>" not in lines[s - 1]:
              sys.exit(f"FATAL: enum_underlying_type head not found in {p}")
          start = s - 1
          end = next((i for i in range(s, len(lines)) if lines[i].rstrip() == "};"), None)
          if end is None:
              sys.exit(f"FATAL: end not found in {p}")
          if "T (-1)" not in "".join(lines[start:end]):
              sys.exit(f"FATAL: enum_underlying_type body changed upstream in {p}")
          new_block = """template<typename T>
          struct enum_underlying_type
          {
            typedef typename
              integer_for_size<sizeof (T),
                               std::is_signed<typename std::underlying_type<T>::type>::value>::type
              type;
          };
          """
          lines[start:end + 1] = [new_block]
          p.write_text("".join(lines))
          print(f"patched {p} for enum signedness")
          PYEOF
            git -C gdb diff -- gdbsupport/enum-flags.h || true
          fi

          if [ -f gdb/gdb/unittests/enum-flags-selftests.c ]; then
            python3 - gdb/gdb/unittests/enum-flags-selftests.c <<'PYEOF'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          src = p.read_text()
          reps = [
            ("CHECK_VALID (true,  int,  true ? EF () : EF2 ())",
             "CHECK_VALID (true,  int,  (int)(true ? EF () : EF2 ()))"),
            ("CHECK_VALID (true,  int,  true ? EF2 () : EF ())",
             "CHECK_VALID (true,  int,  (int)(true ? EF2 () : EF ()))"),
            ("CHECK_VALID (true,  int,  true ? EF () : RE2 ())",
             "CHECK_VALID (true,  int,  (int)(true ? EF () : RE2 ()))"),
            ("CHECK_VALID (true,  int,  true ? RE2 () : EF ())",
             "CHECK_VALID (true,  int,  (int)(true ? RE2 () : EF ()))"),
          ]
          n = 0
          for old, new in reps:
              if new in src: continue
              if old in src: src = src.replace(old, new, 1); n += 1
          if n: p.write_text(src); print(f"patched {n} selftest lines")
          PYEOF
            git -C gdb diff -- gdb/unittests/enum-flags-selftests.c || true
          fi

      - name: Patch (all Unix hosts)
        working-directory: xuantie-gnu-toolchain
        run: |
          if [ -f newlib/libc/machine/riscv/pthread.c ]; then
            python3 - newlib/libc/machine/riscv/pthread.c <<'PYEOF'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          src = p.read_text()
          old = '#include "../../libgloss/libnosys/config.h"'
          if old not in src:
              print(f"{p}: nothing to patch"); sys.exit(0)
          p.write_text(src.replace(old, '#include "config.h"', 1))
          print(f"patched {p}")
          PYEOF
            git -C newlib diff -- libc/machine/riscv/pthread.c || true
          fi

      - name: Configure
        working-directory: xuantie-gnu-toolchain
        run: |
          GDB_FLAG="--enable-gdb"
          if [ "$ENABLE_GDB" != "true" ]; then GDB_FLAG="--disable-gdb"; fi

          ./configure \
            --prefix="$GITHUB_WORKSPACE/$INSTALL_DIR" \
            --with-cmodel=medany \
            --enable-multilib \
            $GDB_FLAG \
            --with-gcc-dep-libs="$HOST_DEPS" \
            LDFLAGS="-L$HOST_DEPS/lib" \
            CPPFLAGS="-I$HOST_DEPS/include"

          [ -f Makefile ] || { echo "ERROR: no Makefile after configure" >&2; exit 1; }
          cp Makefile Makefile.bak

          perl -pi -e 's|^(CONFIGURE_GCC_DEP_LIBS\s*=.*)$|$1 --disable-nls --without-zstd|' Makefile

          echo "--- patched CONFIGURE_GCC_DEP_LIBS ---"
          grep -n '^CONFIGURE_GCC_DEP_LIBS' Makefile || true

          grep -q '^CONFIGURE_GCC_DEP_LIBS.*--disable-nls' Makefile \
            || { echo "ERROR: CONFIGURE_GCC_DEP_LIBS patch did not take"; \
                 grep -n 'CONFIGURE_GCC_DEP_LIBS' Makefile.bak; exit 1; }

      - name: Build
        working-directory: xuantie-gnu-toolchain
        run: |
          JOBS="$( (sysctl -n hw.ncpu 2>/dev/null) || nproc )"
          make \
            BINUTILS_TARGET_FLAGS_EXTRA="--disable-nls --without-zstd --without-lzma" \
            BINUTILS_NATIVE_FLAGS_EXTRA="--disable-nls --without-zstd --without-lzma" \
            GDB_TARGET_FLAGS_EXTRA="--disable-nls --without-zstd --without-lzma" \
            GDB_NATIVE_FLAGS_EXTRA="--disable-nls --without-zstd --without-lzma" \
            -j"$JOBS"

      - name: Verify
        run: |
          GCC_BIN="$GITHUB_WORKSPACE/$INSTALL_DIR/bin/riscv64-unknown-elf-gcc"
          "$GCC_BIN" --version
          file "$GCC_BIN"

          if [ "${{ runner.os }}" = "macOS" ]; then
            if find "$GITHUB_WORKSPACE/$INSTALL_DIR" -type f -print0 \
                 | xargs -0 -n1 -P4 sh -c '
                     file -b "$0" | grep -q "Mach-O" || exit 0
                     otool -L "$0" 2>/dev/null
                   ' \
                 | grep -E "^\s+/opt/homebrew|^\s+/usr/local"; then
              echo "ERROR: Homebrew paths still present"; exit 1
            fi

            ARCH_OK=1
            for BIN in \
              "$GITHUB_WORKSPACE/$INSTALL_DIR/bin/riscv64-unknown-elf-gcc" \
              "$GITHUB_WORKSPACE/$INSTALL_DIR/bin/riscv64-unknown-elf-ld" ; do
              [ -f "$BIN" ] || continue
              file "$BIN" | grep -qE "Mach-O 64-bit executable (arm64|x86_64)" || ARCH_OK=0
            done
            [ "$ARCH_OK" = "1" ] || { echo "ERROR: unexpected arch"; exit 1; }
          else
            if find "$GITHUB_WORKSPACE/$INSTALL_DIR" -type f -perm -u+x -print0 \
                 | xargs -0 -n1 -P4 sh -c '
                     file -b "$0" | grep -q "ELF" || exit 0
                     ldd "$0" 2>/dev/null
                   ' \
                 | grep -E "^\s+/tmp/|/home/runner/"; then
              echo "ERROR: runner-local paths in toolchain"; exit 1
            fi
          fi
          echo "OK: verify step complete."

      - name: Package
        run: |
          tar -czf "$GITHUB_WORKSPACE/$TARBALL" -C "$GITHUB_WORKSPACE/$INSTALL_DIR" .
          if command -v shasum >/dev/null; then
            shasum -a 256 "$GITHUB_WORKSPACE/$TARBALL" | tee "$GITHUB_WORKSPACE/$TARBALL.sha256"
          else
            sha256sum "$GITHUB_WORKSPACE/$TARBALL" | tee "$GITHUB_WORKSPACE/$TARBALL.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xuantie-gnu-toolchain-${{ matrix.name }}
          path: |
            ${{ env.TARBALL }}
            ${{ env.TARBALL }}.sha256

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes || true
          gh release upload "$TAG" "$TARBALL" "$TARBALL.sha256" --clobber

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      ENABLE_GDB: 'false'
      TARBALL: xuantie-gnu-toolchain-windows-x86_64.tar.gz

    steps:
      - uses: actions/checkout@v5

      - name: Enable Windows Long Paths
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make tar wget curl python autoconf automake libtool pkgconf
            texinfo gawk bison flex m4 patch diffutils
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-gmp mingw-w64-x86_64-mpfr mingw-w64-x86_64-mpc
            mingw-w64-x86_64-isl mingw-w64-x86_64-zlib mingw-w64-x86_64-expat
      
      - name: Clone (MSYS2)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          rm -rf /d/b
          git clone --branch "$XUANTIE_BRANCH" "$XUANTIE_REPO" /d/b
          cd /d/b
          git fetch --tags origin
          git checkout "$XUANTIE_REF"

          git submodule update --init binutils gcc newlib

          git rev-parse HEAD
          git submodule status || true

      - name: Patch libcody for C++20 char8_t (MSYS2)
        shell: msys2 {0}
        run: |
          cd /d/b
          CODY="gcc/libcody/cody.hh"
          if [ ! -f "$CODY" ]; then
            echo "ERROR: $CODY not found"; exit 1
          fi
          echo "Patching $CODY"
          python - "$CODY" <<'PYEOF'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          txt = p.read_text()

          if "char8_t const (&s)" in txt:
              print("cody.hh already patched for char8_t")
              sys.exit(0)

          needle = "constexpr char S2C (char const (&s)[I])"
          if needle not in txt:
              sys.exit("FATAL: S2C signature not found in cody.hh")

          start = txt.index(needle)
          brace = txt.index("{", start)
          depth = 0
          end = None
          for i in range(brace, len(txt)):
              ch = txt[i]
              if ch == "{":
                  depth += 1
              elif ch == "}":
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break

          if end is None:
              sys.exit("FATAL: S2C function body not found in cody.hh")

          insertion = """
          #if defined(__cpp_char8_t) && __cpp_char8_t >= 201811
          template<unsigned int I>
          constexpr char S2C (char8_t const (&s)[I])
          {
            return static_cast<char>(s[0]);
          }
          #endif
          """

          p.write_text(txt[:end] + insertion + txt[end:])
          print("Patched cody.hh: added char8_t overload of S2C")
          PYEOF

          for FILE in gcc/libcody/client.cc gcc/libcody/server.cc; do
            [ -f "$FILE" ] || { echo "$FILE not found, skipping"; continue; }
            echo "Patching $FILE"
            python - "$FILE" <<'PYEOF'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          src = p.read_text()
          if "(const char *) u8" in src:
              print(f"{p} already patched"); sys.exit(0)
          pat = re.compile(r'(?<!\)\s)u8"([^"]*)"')
          n = 0
          def repl(m):
              global n
              n += 1
              return f'(const char *) u8"{m.group(1)}"'
          src = pat.sub(repl, src)
          if n:
              p.write_text(src)
              print(f"Patched {n} u8 literals in {p.name}")
          else:
              print(f"No u8 literals found in {p.name}")
          PYEOF
          done
          git diff -- gcc/libcody/cody.hh gcc/libcody/client.cc gcc/libcody/server.cc || true

      - name: Patch GCC system.h for safe-ctype (MSYS2)
        shell: msys2 {0}
        run: |
          cd /d/b
          SYS_H="gcc/gcc/system.h"
          if [ ! -f "$SYS_H" ]; then
            echo "ERROR: $SYS_H not found"; exit 1
          fi
          echo "Patching $SYS_H"
          python - "$SYS_H" <<'PYEOF'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          txt = p.read_text()
          safe_idx = txt.find('#include "safe-ctype.h"')
          if safe_idx == -1:
              sys.exit("FATAL: safe-ctype.h not found in system.h")
          if "# include <memory>" in txt[:safe_idx]:
              print("system.h already includes <memory> before safe-ctype.h")
              sys.exit(0)
          target = "# include <cstring>"
          if target not in txt[:safe_idx]:
              sys.exit("FATAL: target '# include <cstring>' not found before safe-ctype.h")
          txt = txt.replace(target, "# include <memory>\n# include <cstring>", 1)
          p.write_text(txt)
          print("Patched system.h: included <memory> before safe-ctype.h")
          PYEOF
          git diff -- gcc/gcc/system.h || true

      - name: Patch newlib pthread (MSYS2)
        shell: msys2 {0}
        run: |
          cd /d/b
          if [ -f newlib/libc/machine/riscv/pthread.c ]; then
            sed -i 's|#include "../../libgloss/libnosys/config.h"|#include "config.h"|' \
              newlib/libc/machine/riscv/pthread.c
          fi

      - name: Configure (MSYS2)
        shell: msys2 {0}
        env:
          MSYSTEM: MINGW64
          CC: x86_64-w64-mingw32-gcc
          CXX: x86_64-w64-mingw32-g++
          CFLAGS: -std=gnu17
          CXXFLAGS: -std=gnu++17
        run: |
          set -euo pipefail
          cd /d/b

          ./configure \
            --host=x86_64-w64-mingw32 \
            --prefix=/d/b/install \
            --with-cmodel=medany \
            --enable-multilib \
            --disable-gdb
            
      - name: Build (MSYS2)
        shell: msys2 {0}
        env:
          MSYSTEM: MINGW64
        run: |
          set -euo pipefail
          cd /d/b

          make \
            BINUTILS_TARGET_FLAGS_EXTRA="--disable-nls --without-zstd --without-lzma" \
            BINUTILS_NATIVE_FLAGS_EXTRA="--disable-nls --without-zstd --without-lzma" \
            -j"$(nproc)"

      - name: Package (MSYS2)
        shell: msys2 {0}
        run: |
          WS="$(cygpath -u "$GITHUB_WORKSPACE")"
          cd /d/b/install
          tar -czf "$WS/$TARBALL" .
          sha256sum "$WS/$TARBALL" | tee "$WS/$TARBALL.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xuantie-gnu-toolchain-windows-x86_64
          path: |
            ${{ env.TARBALL }}
            ${{ env.TARBALL }}.sha256

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes || true
          gh release upload "$TAG" "$TARBALL" "$TARBALL.sha256" --clobber

name: Build macOS ARM64 Xuantie Toolchain

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Latest stable upstream at time of scaffolding (2026-09-13).
# V3.0.1 is the newest non-nightly release on XUANTIE-RV/xuantie-gnu-toolchain.
# T-head-Semi/xuantie-gnu-toolchain redirects to XUANTIE-RV; use canonical URL.
env:
  XUANTIE_REPO: https://github.com/XUANTIE-RV/xuantie-gnu-toolchain.git
  XUANTIE_REF: V3.0.1 # tag; full commit is c66309b74edd581125a8165f07296c85d3fa71c9
  XUANTIE_BRANCH: xuantie-gnu-toolchain
  INSTALL_DIR: xuantie-gnu-toolchain/install
  # GDB is built by upstream default. 'true' (default) passes --enable-gdb and
  # inits the gdb submodule; 'false' passes --disable-gdb for a faster GDB-less build.
  ENABLE_GDB: 'true'

jobs:
  build:
    # macos-14 is deprecated (fully unsupported after 2026-11-02), so build on
    # the supported arm64 images instead. Both jobs produce native arm64 binaries.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    env:
      TARBALL: xuantie-gnu-toolchain-${{ matrix.os }}-arm64.tar.gz

    steps:
      - uses: actions/checkout@v5 # node24 runtime (v4 is node20, deprecated)

      - name: Show runner arch
        run: |
          uname -a
          arch
          sw_vers
          sysctl -n hw.ncpu || true

      - name: Install Homebrew dependencies
        run: |
          brew update
          # NOTE: `flock` is required — upstream's Makefile shells out to it when
          # initializing submodules on demand, and macOS ships no flock(1).
          brew install python3 gawk gnu-sed gmp mpfr libmpc isl zlib expat coreutils texinfo wget autoconf automake libtool pkg-config flock

      - name: Add GNU tools to PATH
        run: |
          echo "$(brew --prefix)/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/opt/gnu-sed/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Clone Xuantie GNU Toolchain (pinned)
        run: |
          git clone --branch "$XUANTIE_BRANCH" "$XUANTIE_REPO" xuantie-gnu-toolchain
          cd xuantie-gnu-toolchain
          git fetch --tags origin
          git checkout "$XUANTIE_REF"
          # NOTE: do NOT use `git submodule update --init --recursive` here.
          # At V3.0.1 the pinned dejagnu commit is no longer fetchable from
          # riscv-collab/riscv-dejagnu ("not our ref"), and qemu/llvm/spike/pk/
          # musl/glibc/dejagnu are not needed for a bare-metal (newlib) build
          # anyway (upstream configure fetches required modules on demand).
          # NOTE: default `make` builds GDB too (upstream default), so the gdb
          # submodule must be present unless ENABLE_GDB=false (--disable-gdb).
          git submodule update --init binutils gcc newlib
          if [ "$ENABLE_GDB" = "true" ]; then
            git submodule update --init gdb
          fi
          git rev-parse HEAD
          git submodule status || true
          git status --short --branch || true
          # NOTE: `M linux-headers/...netfilter/...` case-collision warnings on
          # macOS are harmless for newlib builds. The default APFS volume is
          # case-insensitive and those headers (only used for linux/glibc
          # builds) collide by case. Ignore them.

      - name: Patch for macOS ARM64
        working-directory: xuantie-gnu-toolchain
        run: |
          # Remove Darwin-specific object files that break on arm64.
          # Upstream config.host assumes old x86_64-darwin host fragments.
          # NOTE: since V3.0.1 the gcc submodule lives at `gcc/`, not `riscv-gcc/`
          # (confirmed by submodule map: `Submodule 'gcc' ... path 'gcc'`).
          if [ -f gcc/gcc/config.host ]; then
            perl -pi -e 's/.*=host-darwin\.o$//' gcc/gcc/config.host || true
            perl -pi -e 's/.* x-darwin\.$//' gcc/gcc/config.host || true
            git diff -- gcc/gcc/config.host || true
          else
            echo "gcc/gcc/config.host not found, skipping darwin patch"
          fi

          # Work around ancient bundled zlib (zutil.h) defining
          # `fdopen(fd,mode) NULL`, which poisons macOS SDK headers (<stdio.h>
          # declares fdopen, so the macro corrupts its declaration and the build
          # dies in libz_a-zutil.o). macOS has a real fdopen(), so skip the define
          # on Apple and use it.
          # NOTE: binutils and gdb are separate checkouts of binutils-gdb, each
          # with its own bundled zlib copy — both must be patched.
          for ZUTIL in binutils/zlib/zutil.h gdb/zlib/zutil.h; do
            if [ ! -f "$ZUTIL" ]; then
              echo "$ZUTIL not present, skipping"
              continue
            fi
            python3 - "$ZUTIL" <<'PYEOF'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          lines = p.read_text().splitlines(keepends=True)
          if any("elif !defined(__APPLE__)" in l for l in lines):
              print(f"{p} already patched for Apple fdopen, skipping")
          else:
              patched = 0
              for i, l in enumerate(lines):
                  if "define fdopen(fd,mode) NULL" not in l:
                      continue
                  # walk upward to the #else of the __MWERKS__ branch (the one
                  # whose previous line pulls in <unix.h>); other fdopen sites
                  # (BEOS/RISCOS, MSVC) have no such context and are left alone
                  for j in range(i - 1, max(i - 8, 0), -1):
                      if re.match(r"\s*#\s*else\s*$", lines[j]):
                          if "unix.h" in lines[j - 1]:
                              indent = lines[j].split("else")[0]
                              lines[j] = f"{indent}elif !defined(__APPLE__)\n"
                              patched += 1
                          break
              if patched != 1:
                  sys.exit(f"FATAL: expected to patch 1 fdopen site in {p}, patched {patched}")
              p.write_text("".join(lines))
              print(f"patched {p} for Apple fdopen")
          PYEOF
            git -C "${ZUTIL%%/*}" diff -- "${ZUTIL#*/}" || true
          done

          # Work around newer Clang rejecting GDB's enum signedness detection:
          # gdbsupport/enum-flags.h computes static_cast<bool>(T (-1) < T (0)),
          # but converting -1 to an enum outside its range is a hard error on
          # recent Clang ("non-type template argument is not a constant
          # expression") with no warning flag to disable, breaking every TU
          # including defs.h.  Detect the signedness of the true underlying
          # type instead, which agrees everywhere the old expression compiled
          # (and matches current upstream GDB's resolution).
          if [ -f gdb/gdbsupport/enum-flags.h ]; then
            python3 - gdb/gdbsupport/enum-flags.h <<'PYEOF'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          src = p.read_text()
          if "std::is_signed<typename std::underlying_type<T>::type>::value" in src:
              print(f"{p} already patched for enum signedness, skipping")
          else:
              lines = src.splitlines(keepends=True)
              s = next((i for i, l in enumerate(lines)
                        if "struct enum_underlying_type" in l), None)
              if s is None or s == 0 or "template<typename T>" not in lines[s - 1]:
                  sys.exit(f"FATAL: enum_underlying_type head not found in {p}")
              start = s - 1
              end = next((i for i in range(s, len(lines))
                          if lines[i].rstrip() == "};"), None)
              if end is None:
                  sys.exit(f"FATAL: end of enum_underlying_type not found in {p}")
              if "T (-1)" not in "".join(lines[start:end]):
                  sys.exit(f"FATAL: enum_underlying_type body changed upstream in {p}")
              new_block = """template<typename T>
          struct enum_underlying_type
          {
            /* NOTE(apple-clang): signedness used to be detected with
               static_cast<bool>(T (-1) < T (0)), but newer Clang rejects
               converting -1 to an enum outside its range as a hard error, with
               no warning flag to disable it.  The signedness of the true
               underlying type agrees everywhere the old expression compiled.  */
            typedef typename
              integer_for_size<sizeof (T),
                               std::is_signed<typename std::underlying_type<T>::type>::value>::type
              type;
          };
          """
              lines[start:end + 1] = [new_block]
              p.write_text("".join(lines))
              print(f"patched {p} for enum signedness detection")
          PYEOF
            git -C gdb diff -- gdbsupport/enum-flags.h || true
          fi

          # Work around newer Clang ternary operator type resolution in GDB's enum-flags tests:
          # enum-flags-selftests.c uses CHECK_VALID() to verify that ternary expressions
          # involving enum classes resolve to expected types. Newer Clang (in both Xcode 16.4
          # and 26.6) has stricter type resolution for conditional expressions involving
          # enum classes and doesn't automatically convert to int. Explicit casting fixes this.
          if [ -f gdb/gdb/unittests/enum-flags-selftests.c ]; then
            python3 - gdb/gdb/unittests/enum-flags-selftests.c <<'PYEOF'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          src = p.read_text()
          
          # Lines that need fixing (254-258 in the original file)
          replacements = [
              ("CHECK_VALID (true,  int,  true ? EF () : EF2 ())", 
               "CHECK_VALID (true,  int,  (int)(true ? EF () : EF2 ()))"),
              ("CHECK_VALID (true,  int,  true ? EF2 () : EF ())", 
               "CHECK_VALID (true,  int,  (int)(true ? EF2 () : EF ()))"),
              ("CHECK_VALID (true,  int,  true ? EF () : RE2 ())", 
               "CHECK_VALID (true,  int,  (int)(true ? EF () : RE2 ()))"),
              ("CHECK_VALID (true,  int,  true ? RE2 () : EF ())", 
               "CHECK_VALID (true,  int,  (int)(true ? RE2 () : EF ()))"),
          ]
          
          patched = 0
          for old, new in replacements:
              if new in src:
                  print(f"Already patched: {old[:50]}...")
              elif old in src:
                  src = src.replace(old, new, 1)
                  patched += 1
          
          if patched > 0:
              p.write_text(src)
              print(f"Patched {patched} enum-flags ternary expressions for Clang compatibility")
          elif patched == 0 and not any(new in src for _, new in replacements):
              print("WARNING: Could not find enum-flags ternary expressions to patch")
          PYEOF
            git -C gdb diff -- gdb/unittests/enum-flags-selftests.c || true
          fi

          # Work around broken relative includes in newlib's riscv pthread stubs
          # (same root cause as pine_ox64's riscv-newlib.patch): pthread.c includes
          # "../../libgloss/libnosys/config.h", which exists nowhere (config.h is
          # generated into the build tree and found via -I), failing the newlib
          # build.  Use a plain #include "config.h" like the rest of newlib.
          # The warning.h include on the next line already points at the right
          # place (newlib/libgloss) and is left alone.
          if [ -f newlib/libc/machine/riscv/pthread.c ]; then
            python3 - newlib/libc/machine/riscv/pthread.c <<'PYEOF'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          src = p.read_text()
          if '#include "config.h"' in src and "libgloss/libnosys/config.h" not in src:
              print(f"{p} already patched for config.h include, skipping")
          else:
              old = '#include "../../libgloss/libnosys/config.h"'
              if old not in src:
                  sys.exit(f"FATAL: pthread.c config.h include not found in {p}")
              p.write_text(src.replace(old, '#include "config.h"', 1))
              print(f"patched {p} for config.h include")
          PYEOF
            git -C newlib diff -- libc/machine/riscv/pthread.c || true
          fi

          # If newlib fails further, see the pine_ox64 notes:
          # https://github.com/datp4ddy/pine_ox64/blob/main/build_toolchain_macos.md

      - name: Configure
        working-directory: xuantie-gnu-toolchain
        run: |
          GDB_FLAG="--enable-gdb"
          if [ "$ENABLE_GDB" != "true" ]; then
            GDB_FLAG="--disable-gdb"
          fi
          # Static linking flags for GMP/MPFR/MPC/ISL
          BREW_PREFIX="$(brew --prefix)"
          LDFLAGS="-L${BREW_PREFIX}/opt/gmp/lib -L${BREW_PREFIX}/opt/mpfr/lib -L${BREW_PREFIX}/opt/libmpc/lib -L${BREW_PREFIX}/opt/isl/lib"
          CPPFLAGS="-I${BREW_PREFIX}/opt/gmp/include -I${BREW_PREFIX}/opt/mpfr/include -I${BREW_PREFIX}/opt/libmpc/include -I${BREW_PREFIX}/opt/isl/include"
          
          ./configure --prefix="$GITHUB_WORKSPACE/$INSTALL_DIR" --with-cmodel=medany --enable-multilib $GDB_FLAG \
            --with-gcc-dep-libs="$(brew --prefix)" \
            --with-stage1-ldflags="-static-libgcc" \
            --with-boot-ldflags="-static-libgcc -static-libstdc++" \
            LDFLAGS="$LDFLAGS" \
            CPPFLAGS="$CPPFLAGS"

      - name: Build
        working-directory: xuantie-gnu-toolchain
        run: |
          make -j"$(sysctl -n hw.ncpu)"

      - name: Verify native arm64 binaries
        run: |
          "$GITHUB_WORKSPACE/$INSTALL_DIR/bin/riscv64-unknown-elf-gcc" --version
          file "$GITHUB_WORKSPACE/$INSTALL_DIR/bin/riscv64-unknown-elf-gcc"
          # Must print "arm64", not "x86_64"
          file "$GITHUB_WORKSPACE/$INSTALL_DIR/bin/riscv64-unknown-elf-gcc" | grep -q "arm64"
          otool -L "$GITHUB_WORKSPACE/$INSTALL_DIR/bin/riscv64-unknown-elf-gcc" || true

      - name: Package
        run: |
          tar -czf "$GITHUB_WORKSPACE/$TARBALL" -C "$GITHUB_WORKSPACE/$INSTALL_DIR" .
          shasum -a 256 "$GITHUB_WORKSPACE/$TARBALL" | tee "$GITHUB_WORKSPACE/$TARBALL.sha256"
          ls -lh "$GITHUB_WORKSPACE/$TARBALL" "$GITHUB_WORKSPACE/$TARBALL.sha256"

      - name: Upload artifact
        # Pinned main @ 043fb46 (2026-04-10, node24). No v6 release yet (v5 is still
        # node20, deprecated) — switch back to a version tag once v6 exists.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xuantie-gnu-toolchain-${{ matrix.os }}-arm64
          path: |
            ${{ env.TARBALL }}
            ${{ env.TARBALL }}.sha256

      - name: Create Release
        # NOTE: softprops/action-gh-release@v2 is still node20 (deprecated), so the
        # release is published with the preinstalled `gh` CLI instead (no node at all).
        # Matrix race-safe: exactly one job creates the release, both attach assets.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes 2>/dev/null || true
          fi
          gh release upload "$TAG" "$TARBALL" "$TARBALL.sha256" --clobber
